name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # The tested code only uses the stdlib, so pytest is all the tests need.
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests

  doctor:
    # Installs the studio on a clean Linux machine, following the doctor's own fixes,
    # and checks that the doctor then reports everything as installed.
    name: Doctor (ubuntu-latest, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: manim_engine/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion_engine/package-lock.json
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg texlive texlive-latex-extra dvisvgm libcairo2-dev libpango1.0-dev pkg-config
      - name: Fonts
        run: |
          mkdir -p ~/.local/share/fonts
          cp shared/fonts/*.ttf ~/.local/share/fonts/
          fc-cache -f
      - name: Python venv
        run: |
          python -m venv manim_engine/.venv
          manim_engine/.venv/bin/python -m pip install -r manim_engine/requirements.txt -r requirements-dev.txt
      - name: Remotion packages
        working-directory: remotion_engine
        run: npm ci
      - name: Doctor
        run: python scripts/doctor.py
      - name: Typecheck Remotion
        working-directory: remotion_engine
        run: npm run typecheck
